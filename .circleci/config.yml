version: 2.1

jobs:
  deploy-dev:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - run:
          name: Build
          command: yarn build
      - run:
          name: Deploy dev environment
          command: yarn deploy --require-approval never

workflows:
  deploy-on-main-merge:
    jobs:
      - deploy-dev:
          context: aws-dev
          filters:
            branches:
              only: main